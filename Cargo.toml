[workspace]
resolver = "3"
# turnstile-wire is pure (no I/O, no clock, no operating system): the messages, the codec and the fixed
# allow-list of device kinds with its per-event ceilings. turnstile-client is what palmrest and keycap
# link: sync, small, no bus and no async runtime. turnstile is the root daemon.
# scripts/check-boundary.sh checks the edges.
members = ["crates/turnstile-wire", "crates/turnstile-client", "crates/turnstile"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.92"
repository = "https://github.com/PoHsuanLai/turnstile"
publish = false

[workspace.dependencies]
turnstile-wire = { path = "crates/turnstile-wire" }
turnstile-client = { path = "crates/turnstile-client" }

# Caller identity, by git tag (never a path).
peephole = { git = "https://github.com/PoHsuanLai/peephole", tag = "v0.1.0" }
peephole-core = { git = "https://github.com/PoHsuanLai/peephole", tag = "v0.1.0", features = ["desktop"] }

thiserror = "2"
# Sockets, poll and file system calls without `unsafe` (MIT OR Apache-2.0; `recv` returns a pair in 1.1).
rustix = { version = "1.1", default-features = false, features = ["std"] }
# Safe uinput ioctls, including LED bits that `evdev` 0.13 cannot set (MIT).
input-linux = { version = "0.7", default-features = false }
# Takes the socket systemd passes in, checking its family and type (Apache-2.0).
listenfd = "1.0"
# Constants only (AF_UNIX, SOCK_SEQPACKET) for listenfd.
libc = "0.2"
tempfile = "3"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
missing_debug_implementations = "warn"

[profile.release]
# A thread that panics must take the service down, not leave a half-working one that systemd sees as
# alive (the lesson of the palmrest socket thread). Socket activation brings it back.
panic = "abort"
